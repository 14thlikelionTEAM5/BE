spring:
  application:
    name: 5Team
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/team5?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:team5}
    password: ${DB_PASSWORD:team5}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  # 로컬 개발용 기본값. 배포 서버는 반드시 환경변수 JWT_SECRET으로 덮어씀 (32자 이상)
  secret: ${JWT_SECRET:local-dev-only-secret-key-change-me-0123456789abcdef}
  expiration-seconds: 86400

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs